# Long polling needs no inbound traffic, so there are no ports at all.
name: t212-cash-interest-bot

services:
  bot:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: t212-cash-interest-bot:latest
    container_name: t212-cash-interest-bot
    # Only the bot's own variables belong in this .env (see .env.example): compose hands the
    # container every line of it.
    env_file: .env
    volumes:
      - data:/app/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    pids_limit: 64
    # Measured on the server: ~210 MB with aiogram, pydantic and matplotlib loaded, ~20 MB more
    # while a ten-year chart is drawn (one at a time).
    mem_limit: 384m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}

volumes:
  data:
