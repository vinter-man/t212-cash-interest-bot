[project]
name = "t212-cash-interest-bot"
version = "1.0.0"
description = "Unofficial Telegram bot: daily interest on uninvested cash by Trading 212's published formula, and where their published rates disagree."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31,<4",
    "aiosqlite>=0.22",
    "apscheduler>=3.11,<4",
    "httpx>=0.28",
    "matplotlib>=3.11",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.16",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170",
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "respx>=0.23",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cash_interest"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
# The live smoke test reaches the real sources; it runs from its own workflow, never by default.
addopts = "--strict-markers -m 'not live'"
markers = [
    "live: reaches the real sources over the network (pytest -m live)",
    "e2e: runs the bot as a separate process against a fake Telegram",
]

[tool.coverage.run]
source = ["cash_interest"]
branch = true
omit = ["cash_interest/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@abstractmethod"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PT", "DTZ", "S", "N", "C4", "PIE", "RET", "PL", "PERF"]
ignore = [
    "PLR0913",  # handlers and dataclasses take what they need
    "PLR2004",  # 3 letters in a currency code is not a magic number
    "N818",     # `except Blocked`, `except Unavailable`: the outcomes read better without "Error"
    "RUF001",   # the copy uses typographic characters on purpose: × − · “ ”
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["cash_interest", "scripts", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# APScheduler 3 ships no type information.
module = ["apscheduler.*"]
ignore_missing_imports = true
